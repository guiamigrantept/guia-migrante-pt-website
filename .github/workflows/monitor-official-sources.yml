name: Monitor official sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor/monitor_sources.py'
      - 'monitor/discover_official_updates.py'
      - 'monitor/normalize_discovery.py'
      - 'monitor/validate_procedure_catalog.py'
      - 'monitor/build_monitor_health.py'
      - 'monitor/dre_fallback.py'
      - 'monitor/source_review_filters.py'
      - 'monitor/accept_non_substantive_gov_changes.py'
      - 'monitor/recover_required_sources.py'
      - 'site/data/locales.json'
      - 'site/data/procedure-catalog.json'
      - 'site/official-updates.js'
      - 'site/verified-facts.js'
      - 'site/update-health.js'
      - 'requirements-monitor.txt'
      - '.github/workflows/monitor-official-sources.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  issues: write
  deployments: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify monitor files
        run: |
          test -f requirements-monitor.txt
          test -f monitor/monitor_sources.py
          test -f monitor/discover_official_updates.py
          test -f monitor/normalize_discovery.py
          test -f monitor/validate_procedure_catalog.py
          test -f monitor/build_monitor_health.py
          test -f monitor/dre_fallback.py
          test -f monitor/source_review_filters.py
          test -f monitor/accept_non_substantive_gov_changes.py
          test -f monitor/recover_required_sources.py
          test -f site/data/locales.json
          test -f site/data/procedure-catalog.json
          test -f site/official-updates.js
          test -f site/verified-facts.js
          test -f site/update-health.js
          test -f scripts/qa.py
          test -d site

      - name: Install monitor dependencies
        run: pip install -r requirements-monitor.txt

      - name: Validate live update clients
        run: |
          node --check site/official-updates.js
          node --check site/verified-facts.js
          node --check site/update-health.js

      - name: Discover recent official updates
        run: python monitor/discover_official_updates.py

      - name: Normalize discovery results
        run: python monitor/normalize_discovery.py

      - name: Check official sources
        run: python monitor/monitor_sources.py

      - name: Filter known dynamic-source noise
        run: python monitor/source_review_filters.py

      - name: Resolve non-substantive gov.pt guide changes
        run: python monitor/accept_non_substantive_gov_changes.py

      - name: Recover required legacy sources
        run: python monitor/recover_required_sources.py

      - name: Check Diário da República RSS
        run: python monitor/dre_fallback.py

      - name: Validate critical procedure coverage
        run: python monitor/validate_procedure_catalog.py

      - name: Build monitor health heartbeat
        run: python monitor/build_monitor_health.py

      - name: Run canonical-site QA
        env:
          QA_SOURCE_MONITOR: '1'
        run: python scripts/qa.py

      - name: Read report
        id: report
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('monitor/report.json',encoding='utf-8'))
          d=json.load(open('monitor/discovery-report.json',encoding='utf-8'))
          h=json.load(open('site/data/monitor-health.json',encoding='utf-8'))
          p=json.load(open('monitor/procedure-coverage.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('changed=%s\n' % ('true' if r.get('changed_sources') else 'false'))
              f.write('blocked=%s\n' % ('true' if r.get('blocked_pages') else 'false'))
              f.write('facts=%s\n' % ('true' if r.get('fact_updates') else 'false'))
              f.write('coverage=%s\n' % ('true' if r.get('coverage_ok') else 'false'))
              f.write('procedure_coverage=%s\n' % ('true' if p.get('ok') else 'false'))
              f.write('dre_alerts=%s\n' % ('true' if r.get('dre_rss_alerts') else 'false'))
              f.write('discovery_ok=%s\n' % ('true' if d.get('ok') else 'false'))
              f.write('discovery_new=%s\n' % ('true' if d.get('new_updates') else 'false'))
              f.write('health=%s\n' % h.get('state','critical'))
              f.write('errors=%s\n' % len(r.get('errors',[])))
          print('baseline_complete=',r.get('baseline_complete'))
          print('source_coverage_ok=',r.get('coverage_ok'))
          print('procedure_coverage_ok=',p.get('ok'))
          print('monitor_health=',h.get('state'))
          print('errors=',len(r.get('errors',[])))
          print('critical_errors=',len(r.get('critical_errors',[])))
          print('dre_rss_ok=',r.get('dre_rss_ok'))
          print('dre_rss_alerts=',len(r.get('dre_rss_alerts',[])))
          print('discovery_sources=',f"{d.get('sources_ok',0)}/{d.get('sources_total',0)}")
          print('new_official_updates=',len(d.get('new_updates',[])))
          PY

      - name: Validate monitoring coverage
        if: steps.report.outputs.coverage != 'true' || steps.report.outputs.procedure_coverage != 'true'
        run: |
          echo 'ERROR: official-source or critical-procedure monitoring coverage is incomplete.'
          exit 1

      - name: Commit monitored state and heartbeat
        run: |
          git config user.name 'Guia Migrante Source Monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add monitor/snapshots monitor/candidates monitor/sources.json monitor/report.json monitor/dre-rss.json monitor/discovery-report.json monitor/procedure-coverage.json site/data/source-status.json site/data/facts.json site/data/change-log.json site/data/official-updates.json site/data/monitor-health.json
          if git diff --cached --quiet; then
            echo 'No repository changes.'
          else
            git commit -m 'chore: monitor official sources'
            git push
          fi

      - name: Refresh checkout to committed monitor state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Publish fresh monitor state to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=guia-migrante-pt
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Cloudflare secrets not configured
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo 'ERROR: monitor state was updated but cannot be published because Cloudflare deployment secrets are missing.'
          exit 1

      - name: Open review issue when official information needs review
        if: steps.report.outputs.blocked == 'true' || steps.report.outputs.dre_alerts == 'true' || steps.report.outputs.discovery_new == 'true' || steps.report.outputs.discovery_ok != 'true' || steps.report.outputs.health != 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/issue.md
          import json
          r=json.load(open('monitor/report.json',encoding='utf-8'))
          d=json.load(open('monitor/discovery-report.json',encoding='utf-8'))
          h=json.load(open('site/data/monitor-health.json',encoding='utf-8'))
          blocked=r.get('blocked_pages',{})
          alerts=r.get('dre_rss_alerts',[])
          discovered=d.get('new_updates',[])
          print(f"Estado automático do monitor: **{h.get('state','unknown')}**")
          print(f"Fontes obrigatórias: {h.get('required_sources',0)} · erros: {h.get('source_error_count',0)} · falhas repetidas acionáveis: {h.get('repeated_source_failure_count',0)}\n")
          if blocked:
              print('## Orientação em quarentena')
              for p,ids in sorted(blocked.items()): print(f'- `{p}` — {", ".join(ids)}')
          if discovered:
              print('\n## Novas publicações oficiais relevantes')
              for item in discovered:
                  print(f"- {item.get('source') or 'Fonte oficial'} · {item.get('date') or 'Sem data'} — {item.get('title') or 'Sem título'} — {item.get('url')}")
                  pages=item.get('pages') or []
                  if pages: print(f"  - Páginas potencialmente relacionadas: {', '.join(pages)}")
          failed=[x for x in d.get('sources',[]) if not x.get('ok')]
          if failed:
              print('\n## Índices oficiais com falha de descoberta')
              for x in failed: print(f"- {x.get('source')}: {x.get('error')}")
          if alerts:
              print('\n## Nova legislação potencialmente relevante no Diário da República')
              for a in alerts: print(f"- {a.get('title') or 'Sem título'} — {a.get('url') or a.get('source')}")
          print('\nPolítica: factos objetivos podem ser atualizados automaticamente; alterações jurídicas ou procedimentais ambíguas são colocadas em quarentena e exigem revisão antes de voltar a orientar o utilizador.')
          PY
          gh label create official-source-change --color D93F0B --description 'Fonte oficial alterada' 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label official-source-change --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create --title 'Fonte oficial alterada — revisão necessária' --label official-source-change --body-file /tmp/issue.md
          else
            gh issue comment "$EXISTING" --body-file /tmp/issue.md
          fi

      - name: Confirm publication policy
        run: echo 'Every successful source-monitor cycle publishes its fresh heartbeat and verified data directly to Cloudflare Pages after QA.'
