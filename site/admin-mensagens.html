<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mensagens da Administração | Guia Migrante PT</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:36px 0 70px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;color:#172554}.brand small{display:block;color:#64748b;font-weight:650;margin-top:3px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 12px 32px rgba(15,23,42,.06)}.login{max-width:620px;margin:40px auto 0;padding:24px}.login h1{margin:0;color:#172554;font-size:2rem}.login p{color:#64748b}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:240px;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit}.btn{border:0;border-radius:10px;background:#1e3a8a;color:#fff;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#1e3a8a;border:1px solid #cbd5e1}.status{min-height:22px;margin-top:10px;font-size:.86rem;color:#b91c1c}.dashboard{display:none;margin-top:28px}.dashboard.show{display:block}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:7px 11px;font:inherit;font-size:.83rem;font-weight:750;cursor:pointer}.filter.active{background:#172554;color:#fff;border-color:#172554}.counts{color:#64748b;font-size:.82rem}.messages{display:grid;gap:12px}.message{padding:18px}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:#64748b;font-size:.77rem}.pill{display:inline-flex;border-radius:999px;padding:4px 7px;background:#eff6ff;color:#1e3a8a;font-weight:800}.message h2{margin:10px 0 4px;font-size:1rem;color:#172554}.message p{white-space:pre-wrap;margin:10px 0 0;line-height:1.55;color:#334155}.contact{margin-top:9px;color:#475569;font-size:.84rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:7px 10px;font:inherit;font-size:.8rem;font-weight:750;cursor:pointer}.empty{padding:34px;text-align:center;color:#64748b}.danger{color:#b91c1c}@media(max-width:600px){.wrap{padding-top:20px}.login{margin-top:22px;padding:18px}.message{padding:15px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">Guia Migrante PT<small>Área reservada · Mensagens da administração</small></div><button class="btn secondary" id="logout" hidden>Terminar sessão</button></div>
  <section class="card login" id="loginBox">
    <h1>Mensagens</h1>
    <p>Introduza a chave de administração. A chave fica apenas nesta sessão do navegador.</p>
    <div class="row"><input id="token" type="password" autocomplete="off" placeholder="Chave de administração"><button class="btn" id="enter">Entrar</button></div>
    <div class="status" id="loginStatus" role="status"></div>
  </section>
  <section class="dashboard" id="dashboard">
    <div class="toolbar"><div class="filters"><button class="filter active" data-status="new">Novas</button><button class="filter" data-status="read">Lidas</button><button class="filter" data-status="closed">Fechadas</button><button class="filter" data-status="all">Todas</button></div><div class="counts" id="counts"></div></div>
    <div class="messages" id="messages"></div>
  </section>
</main>
<script>
(()=>{'use strict';const keyName='gmpAdminContactKey';let token=sessionStorage.getItem(keyName)||'';let filter='new';
const topicLabels={site_error:'Erro ou informação incorreta no site',suggestion:'Sugestão',technical:'Problema técnico',partnership:'Parceria ou colaboração',other:'Outro assunto'};
const $=s=>document.querySelector(s),login=$('#loginBox'),dash=$('#dashboard'),status=$('#loginStatus'),messages=$('#messages'),counts=$('#counts'),logout=$('#logout');
function authHeaders(){return {'Authorization':'Bearer '+token,'Accept':'application/json'}}
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function fmt(date){try{return new Intl.DateTimeFormat('pt-PT',{dateStyle:'medium',timeStyle:'short'}).format(new Date(date+'Z'))}catch{return date}}
async function load(){status.textContent='';try{const r=await fetch('/api/admin/messages?status='+encodeURIComponent(filter)+'&limit=100',{headers:authHeaders(),cache:'no-store'});if(r.status===401){throw new Error('Chave inválida.')}const data=await r.json();if(!r.ok)throw new Error('Não foi possível carregar as mensagens.');sessionStorage.setItem(keyName,token);login.style.display='none';dash.classList.add('show');logout.hidden=false;render(data)}catch(e){status.textContent=e.message||'Erro ao carregar.'}}
function render(data){messages.textContent='';const countMap=Object.fromEntries((data.counts||[]).map(x=>[x.status,Number(x.n||0)]));counts.textContent=`Novas: ${countMap.new||0} · Lidas: ${countMap.read||0} · Fechadas: ${countMap.closed||0}`;const list=data.messages||[];if(!list.length){messages.appendChild(node('div','card empty','Sem mensagens nesta categoria.'));return}for(const m of list){const card=node('article','card message');const meta=node('div','meta');meta.append(node('span','pill',m.status==='new'?'Nova':m.status==='read'?'Lida':'Fechada'));meta.append(node('span','',fmt(m.created_at)));meta.append(node('span','',String(m.locale||'').toUpperCase()));card.append(meta);card.append(node('h2','',topicLabels[m.topic]||m.topic||'Outro assunto'));card.append(node('p','',m.message||''));const c=node('div','contact');c.textContent=[m.name,m.email].filter(Boolean).join(' · ')||'Sem contacto para resposta';card.append(c);if(m.source_path)card.append(node('div','contact','Origem: '+m.source_path));const a=node('div','actions');if(m.email){const b=node('button','', 'Responder por email');b.onclick=()=>{location.href=`mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent('Guia Migrante PT — resposta à sua mensagem')}`};a.append(b)}if(m.status!=='read'){const b=node('button','', 'Marcar como lida');b.onclick=()=>setStatus(m.id,'read');a.append(b)}if(m.status!=='closed'){const b=node('button','', 'Fechar');b.onclick=()=>setStatus(m.id,'closed');a.append(b)}if(m.status!=='new'){const b=node('button','', 'Reabrir');b.onclick=()=>setStatus(m.id,'new');a.append(b)}card.append(a);messages.append(card)}}
async function setStatus(id,newStatus){const r=await fetch('/api/admin/messages',{method:'PATCH',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify({id,status:newStatus})});if(r.ok)load()}
$('#enter').onclick=()=>{token=$('#token').value.trim();if(token)load()};$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')$('#enter').click()});logout.onclick=()=>{sessionStorage.removeItem(keyName);token='';location.reload()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.status;load()});if(token)load();})();
</script>
</body>
</html>
