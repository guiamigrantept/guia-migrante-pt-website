name: Monitor official sources

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
      timezone: 'Europe/Lisbon'

permissions:
  contents: write
  issues: write
  deployments: write

concurrency:
  group: official-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify monitor files
        run: |
          test -f requirements-monitor.txt
          test -f monitor/monitor_sources.py
          test -f scripts/qa.py
          test -d site

      - name: Install monitor dependencies
        run: pip install -r requirements-monitor.txt

      - name: Check official sources
        run: python monitor/monitor_sources.py

      - name: Run QA
        run: python scripts/qa.py

      - name: Read report
        id: report
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('monitor/report.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('changed=%s\n' % ('true' if r.get('changed_sources') else 'false'))
              f.write('blocked=%s\n' % ('true' if r.get('blocked_pages') else 'false'))
              f.write('facts=%s\n' % ('true' if r.get('fact_updates') else 'false'))
              f.write('coverage=%s\n' % ('true' if r.get('coverage_ok') else 'false'))
              f.write('errors=%s\n' % len(r.get('errors',[])))
          print('baseline_complete=',r.get('baseline_complete'))
          print('coverage_ok=',r.get('coverage_ok'))
          print('errors=',len(r.get('errors',[])))
          print('critical_errors=',len(r.get('critical_errors',[])))
          PY

      - name: Commit monitored state
        run: |
          git config user.name 'Guia Migrante Source Monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add monitor/snapshots monitor/sources.json monitor/report.json site/data/source-status.json site/data/facts.json site/data/change-log.json
          if git diff --cached --quiet; then
            echo 'No repository changes.'
          else
            git commit -m 'chore: monitor official sources'
            git push
          fi

      - name: Validate monitoring coverage
        if: steps.report.outputs.coverage != 'true'
        run: |
          echo 'ERROR: the official-source baseline is incomplete. See monitor/report.json.'
          exit 1

      - name: Open review issue when content is quarantined
        if: steps.report.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/issue.md
          import json
          r=json.load(open('monitor/report.json',encoding='utf-8'))
          print('Uma fonte oficial mudou ou ficou indisponível e o Guia retirou automaticamente a orientação potencialmente desatualizada.\n')
          print('## Páginas afetadas')
          for p,ids in sorted(r.get('blocked_pages',{}).items()): print(f'- `{p}` — {", ".join(ids)}')
          print('\nRever a fonte oficial, corrigir PT e EN e validar antes de retirar a quarentena.')
          PY
          gh label create official-source-change --color D93F0B --description 'Fonte oficial alterada' 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label official-source-change --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then gh issue create --title 'Fonte oficial alterada — revisão necessária' --label official-source-change --body-file /tmp/issue.md; else gh issue comment "$EXISTING" --body-file /tmp/issue.md; fi

      - name: Deploy updated site
        if: steps.report.outputs.coverage == 'true' && (steps.report.outputs.changed == 'true' || steps.report.outputs.facts == 'true' || steps.report.outputs.blocked == 'true') && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=guia-migrante-pt
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
