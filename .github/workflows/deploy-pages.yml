name: Deploy site to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/qa.py'
      - 'scripts/build_locales.py'
      - 'scripts/build_locales_uk_ru.py'
      - 'scripts/build_locales_hi_bn.py'
      - 'scripts/build_route_locales.py'
      - 'scripts/build_route_locales_ru.py'
      - 'scripts/build_living_locales.py'
      - 'scripts/build_remaining_locales.py'
      - 'scripts/build_structural_parity_locales.py'
      - 'scripts/apply_full_structure_translation_copy.py'
      - 'scripts/check_locale_parity.py'
      - 'scripts/check_translation_completeness.py'
      - 'scripts/finalize_live_locales.py'
      - 'scripts/build_sitemap.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Rebuild every staged locale from complete Portuguese page structure
        run: python scripts/build_structural_parity_locales.py
      - name: Overlay translated copy without changing the page structure
        run: python scripts/apply_full_structure_translation_copy.py
      - name: Check full page and feature parity after translation overlay
        run: python scripts/check_locale_parity.py
      - name: Audit translation completeness before locale publication
        run: python scripts/check_translation_completeness.py
      - name: Finalize only locales explicitly marked live
        run: python scripts/finalize_live_locales.py
      - name: Build multilingual sitemap
        run: python scripts/build_sitemap.py
      - name: Run site QA
        run: python scripts/qa.py
      - name: Cloudflare secrets not configured yet
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo 'QA passed. Deployment waits for Cloudflare secrets.'
      - name: Deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=guia-migrante-pt
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
