name: Deploy site to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/qa.py'
      - 'scripts/build_locales.py'
      - 'scripts/build_locales_uk_ru.py'
      - 'scripts/build_locales_hi_bn.py'
      - 'scripts/build_route_locales.py'
      - 'scripts/build_route_locales_ru.py'
      - 'scripts/build_living_locales.py'
      - 'scripts/build_remaining_locales.py'
      - 'scripts/build_structural_parity_locales.py'
      - 'scripts/apply_full_structure_translation_copy.py'
      - 'scripts/auto_translate_untranslated_copy.py'
      - 'scripts/translate_exact_pt_residues.py'
      - 'scripts/translate_detected_pt_residues.py'
      - 'scripts/check_locale_parity.py'
      - 'scripts/check_translation_completeness.py'
      - 'scripts/finalize_live_locales.py'
      - 'scripts/build_locale_ux_copy.py'
      - 'scripts/build_search_indexes.py'
      - 'scripts/build_sitemap.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  translate-locales:
    name: Translate ${{ matrix.locale }} on isolated worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        locale: [fr, es, uk, ru, hi, bn]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 langdetect
      - name: Rebuild complete locale structure
        run: python scripts/build_structural_parity_locales.py
      - name: Overlay reviewed translated copy
        run: python scripts/apply_full_structure_translation_copy.py
      - name: Fill untranslated copy for ${{ matrix.locale }}
        env:
          TRANSLATION_LOCALES: ${{ matrix.locale }}
        run: python scripts/auto_translate_untranslated_copy.py
      - name: Translate exact Portuguese residues for ${{ matrix.locale }}
        env:
          TRANSLATION_LOCALES: ${{ matrix.locale }}
        run: python scripts/translate_exact_pt_residues.py
      - name: Translate remaining detected Portuguese residues for ${{ matrix.locale }}
        env:
          TRANSLATION_LOCALES: ${{ matrix.locale }}
        run: python scripts/translate_detected_pt_residues.py
      - name: Upload localized pages
        uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.locale }}
          path: site/${{ matrix.locale }}/
          if-no-files-found: error
          retention-days: 1

  qa-and-deploy:
    needs: translate-locales
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 langdetect
      - name: Rebuild complete staged locale structure
        run: python scripts/build_structural_parity_locales.py
      - name: Overlay reviewed translated copy
        run: python scripts/apply_full_structure_translation_copy.py
      - uses: actions/download-artifact@v4
        with:
          name: locale-fr
          path: site/fr
      - uses: actions/download-artifact@v4
        with:
          name: locale-es
          path: site/es
      - uses: actions/download-artifact@v4
        with:
          name: locale-uk
          path: site/uk
      - uses: actions/download-artifact@v4
        with:
          name: locale-ru
          path: site/ru
      - uses: actions/download-artifact@v4
        with:
          name: locale-hi
          path: site/hi
      - uses: actions/download-artifact@v4
        with:
          name: locale-bn
          path: site/bn
      - name: Check full page and feature parity after translation
        run: python scripts/check_locale_parity.py
      - name: Audit translation completeness before locale publication
        run: python scripts/check_translation_completeness.py
      - name: Finalize only locales explicitly marked live
        run: python scripts/finalize_live_locales.py
      - name: Build localized dynamic UX copy
        run: python scripts/build_locale_ux_copy.py
      - name: Build localized search indexes
        run: python scripts/build_search_indexes.py
      - name: Build multilingual sitemap
        run: python scripts/build_sitemap.py
      - name: Run site QA
        run: python scripts/qa.py
      - name: Cloudflare secrets not configured yet
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo 'QA passed. Deployment waits for Cloudflare secrets.'
      - name: Deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=guia-migrante-pt
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
