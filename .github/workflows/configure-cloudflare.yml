name: Configure Cloudflare production branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages production branch to main
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
          curl --fail-with-body --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/guia-migrante-pt" \
            --header "Authorization: Bearer ${CF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}'
